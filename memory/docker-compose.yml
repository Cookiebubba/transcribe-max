# Local Neo4j for the Graphiti transcript memory.
#   docker compose -f memory/docker-compose.yml up -d
# Browser UI: http://localhost:7474  (user: neo4j / pass: password)
# Bolt:       bolt://localhost:7687
services:
  neo4j:
    image: neo4j:5.26
    container_name: maxblade-graphiti-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
