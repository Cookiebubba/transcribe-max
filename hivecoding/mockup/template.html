<meta name="claude:viewport-fit-sides" content="cover">
<title>Hivecoding Hall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky hex-rail nav over a dark card-shop shell; each view is a full-width
   band with its own inner wrapper carrying the side gutter. Single committed dark
   theme — holographic card treatments only read against an ink ground. */
:root{
  --bg:#0b0a12; --bg-2:#141120; --bg-3:#1c1830; --bg-4:#241f3c;
  --line:#2e2748; --line-2:#413764;
  --fg:#efe9f7; --fg-dim:#a79fc0; --fg-faint:#6f678c;
  --honey:#ffb703; --honey-deep:#e07a00; --honey-ink:#2a1a00;
  --good:#3ddc97; --warn:#ffd166; --crit:#ff5d73;
  --r-common:#7a8597; --r-rare:#36c5c0; --r-epic:#a06bff;
  --r-legendary:#ff8a3d; --r-mythic:#ff5ec7;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body);
  font-size:15px; line-height:1.55; margin:0;
  background-image:
    radial-gradient(1100px 520px at 12% -8%, #1d1636 0%, transparent 62%),
    radial-gradient(900px 460px at 92% 4%, #2a1430 0%, transparent 58%);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#0d0b16}
.wrap{width:100%;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-faint)}

/* ── masthead ─────────────────────────────────────────────── */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:rgba(13,11,22,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.hexmark{width:26px;height:29px;flex:none;background:linear-gradient(150deg,var(--honey),var(--honey-deep));
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.brand span{color:var(--honey)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:.04em;
  background:transparent;color:var(--fg-dim);border:1px solid transparent;border-radius:7px;
  padding:7px 11px;cursor:pointer;text-transform:uppercase}
nav button:hover{color:var(--fg);background:var(--bg-3)}
nav button[aria-selected="true"]{color:var(--honey-ink);background:var(--honey);border-color:var(--honey)}
nav button:focus-visible,.card:focus-visible,.rowbtn:focus-visible{outline:2px solid var(--honey);outline-offset:2px}

.band{padding-block:40px 48px}
.band+.band{border-top:1px solid var(--line)}
.titleblock{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.titleblock h2{font-size:clamp(21px,3.4vw,29px)}
.titleblock p{margin:6px 0 0;color:var(--fg-dim);max-width:62ch;font-size:14px}

/* ── trading cards ────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:16px}
.card{position:relative;min-width:0;aspect-ratio:3/4.2;max-width:100%;border-radius:14px;padding:2px;
  border:none;cursor:pointer;color:inherit;text-align:left;font:inherit;
  background:linear-gradient(160deg,var(--rc,#555) 0%,#2a2440 42%,var(--rc,#555) 100%);
  transform-style:preserve-3d;transition:transform .18s ease,box-shadow .18s ease;
  box-shadow:0 10px 26px rgba(0,0,0,.5)}
.card:hover{box-shadow:0 16px 40px rgba(0,0,0,.62),0 0 0 1px var(--rc,#555)}
.card-in{position:relative;height:100%;border-radius:12px;overflow:hidden;
  background:linear-gradient(178deg,var(--bg-3),var(--bg-2) 58%,#0f0d19);
  display:flex;flex-direction:column}
/* holo / foil treatments — layered gradients driven by pointer position */
.sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;
  background:
    linear-gradient(115deg,transparent 22%,rgba(255,255,255,.5) 46%,transparent 62%),
    conic-gradient(from calc(var(--mx,.5) * 1turn) at 50% 50%,
      #ff5ec7,#ffb703,#3ddc97,#36c5c0,#a06bff,#ff5ec7);
  background-blend-mode:overlay;
  background-position:calc(var(--mx,.5) * 220% - 60%) calc(var(--my,.5) * 220% - 60%);
  background-size:260% 260%,180% 180%}
.card[data-effect="none"] .sheen{display:none}
.card[data-effect="holo"] .sheen{opacity:.26}
.card[data-effect="foil"] .sheen{opacity:.34}
.card[data-effect="glitch"] .sheen{opacity:.3;filter:hue-rotate(160deg) saturate(1.5)}
.card[data-effect="ember"] .sheen{opacity:.36;filter:hue-rotate(-28deg) saturate(1.7)}
.card[data-effect="prismatic"] .sheen{opacity:.46}
.card[data-effect="aurora"] .sheen{opacity:.56;filter:saturate(1.35) brightness(1.1)}

.cardtop{display:flex;align-items:center;gap:7px;padding:9px 10px 7px}
.rank{font-family:var(--data);font-weight:700;font-size:11px;color:var(--rc,#999);
  border:1px solid var(--rc,#555);border-radius:5px;padding:1px 5px;flex:none}
.rar{margin-left:auto;font-family:var(--display);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rc,#999);flex:none}
/* procedural portrait: real avatars drop in here (external images are blocked
   in this preview frame, so these are generated from a hash of the handle) */
.port{position:relative;margin:2px 10px 0;aspect-ratio:1/1;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:grid;place-items:center;overflow:hidden}
.port b{font-family:var(--display);font-size:clamp(20px,4.4vw,30px);font-weight:700;
  color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.02em}
.cardname{font-family:var(--display);font-weight:600;font-size:12.5px;line-height:1.25;
  padding:9px 10px 0;overflow-wrap:anywhere;min-width:0}
.cardstats{margin-top:auto;padding:8px 10px 10px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.stat{font-family:var(--data);font-size:10.5px;font-weight:700;color:var(--fg);
  background:var(--bg-4);border-radius:5px;padding:2px 5px}
.stat i{color:var(--fg-faint);font-style:normal;font-weight:500}
.pips{display:flex;gap:3px;padding:0 10px 10px;flex-wrap:wrap}
.pip{width:17px;height:19px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:var(--bg-4);display:grid;place-items:center;font-size:9px}

/* ── featured hero card ───────────────────────────────────── */
.hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:28px;align-items:center}
.hero .card{aspect-ratio:3/4.2}
.hero h1{font-size:clamp(26px,5vw,44px);line-height:1.06}
.hero .lead{color:var(--fg-dim);margin:12px 0 0;font-size:15px;max-width:54ch}
.blurb{margin:16px 0 0;padding:13px 15px;border-left:2px solid var(--honey);background:var(--bg-2);
  border-radius:0 9px 9px 0;font-size:14.5px}
.blurb em{color:var(--fg-faint);font-style:normal;font-size:12px;display:block;margin-top:7px}
.kpis{display:flex;gap:20px;flex-wrap:wrap;margin-top:20px}
.kpi b{display:block;font-family:var(--data);font-weight:700;font-size:clamp(19px,3.2vw,25px);color:var(--honey)}
.kpi span{font-size:11.5px;color:var(--fg-faint);letter-spacing:.08em;text-transform:uppercase;font-family:var(--display)}

/* ── tables ───────────────────────────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--bg-2)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--fg-faint);background:var(--bg-3);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--data);font-variant-numeric:tabular-nums;text-align:right}
.rowbtn{background:none;border:none;color:var(--honey);font:inherit;cursor:pointer;padding:0;text-align:left}
.muted-row td{color:var(--fg-faint)}
.tag{display:inline-block;font-family:var(--display);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid currentColor}

/* ── badges catalogue ────────────────────────────────────── */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.badge{display:flex;gap:11px;align-items:flex-start;min-width:0;padding:12px;border-radius:10px;
  background:var(--bg-2);border:1px solid var(--line)}
.badge .hex{width:34px;height:38px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:grid;place-items:center;font-size:15px;background:linear-gradient(150deg,var(--rc),#1b1730)}
.badge h4{font-size:13px}
.badge p{margin:3px 0 0;font-size:12px;color:var(--fg-dim)}
.badge .rar{margin:5px 0 0;display:block}

/* ── charts ──────────────────────────────────────────────── */
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:16px}
.chartscroll{overflow-x:auto}
svg{display:block;max-width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--fg-dim)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* ── goals / prompts ─────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;gap:12px;align-items:flex-start;min-width:0;padding:12px 14px;border-radius:10px;
  background:var(--bg-2);border:1px solid var(--line)}
.item .score{font-family:var(--data);font-weight:700;font-size:13px;flex:none;width:38px;text-align:right}
.item .body{min-width:0;flex:1}
.item .body p{margin:0;overflow-wrap:anywhere}
.item .by{font-size:12px;color:var(--fg-faint);margin-top:4px!important}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.embed{font-family:var(--data);font-size:12px;background:#07060d;border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;overflow-x:auto;color:var(--fg-dim);margin-top:14px}
.embed b{color:var(--honey);font-weight:500}
.note{font-size:12.5px;color:var(--fg-faint);margin-top:14px;max-width:72ch}
.prov{border-top:1px solid var(--line);padding-block:22px 34px;font-size:12.5px;color:var(--fg-faint)}
.prov b{color:var(--fg-dim);font-weight:600}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .card{max-width:260px}}
@media (prefers-reduced-motion:reduce){.card{transition:none!important}}
</style>

<script>
/* ───────────────────── data ─────────────────────

const CHATTERS=[
 {h:"@humblelifeskills",m:107,mod:1,mem:1},{h:"@TheZarion007",m:85},
 {h:"@shmloney",m:84},{h:"@byanuragbaral",m:65},{h:"@AppsCreative",m:56},
 {h:"@Sam-Amodei",m:48},{h:"@davidkang5708",m:45,mod:1},{h:"@Ackk53",m:40},
 {h:"@chrislink73",m:34},{h:"@rieefq",m:33},{h:"@BrandynMakes",m:33,mod:1,mem:1},
 {h:"@sumwhat1275",m:29,mem:1},{h:"@Choso-r6f",m:28},{h:"@Zincツ",m:28},
 {h:"@adrianpadurariu",m:27,mem:1},{h:"@RobbieHyatt",m:24},
 {h:"@IAMYOURFATHERANDYOURMOTHER",m:23},{h:"@argofowl",m:21},{h:"@iamdonh",m:19,mod:1}
];
const BOT={h:"@nightbot",m:42,mod:1,verified:1};

const RAR={common:{c:"var(--r-common)",fx:"none"},rare:{c:"var(--r-rare)",fx:"holo"},
  epic:{c:"var(--r-epic)",fx:"holo"},legendary:{c:"var(--r-legendary)",fx:"ember"},
  mythic:{c:"var(--r-mythic)",fx:"aurora"}};

/* rarity is derived, never hand-set — mirrors hivecoding/db/rarity.sql */
function rarityOf(rank,c){
  if(rank===1)return"mythic";
  if(rank<=3||c.m>=10000)return"legendary";
  if(rank<=10)return"epic";
  if(rank<=50||c.m>=1000||c.mem)return"rare";
  return"common";
}
const ROSTER=CHATTERS.map((c,i)=>{
  const rank=i+1,rarity=rarityOf(rank,c);
  const badges=[];
  if(c.m>=100)badges.push({i:"⑩",t:"Century — 100 messages"});
  if(c.mod)badges.push({i:"⛨",t:"Mod Squad — trusted with the mod badge"});
  if(c.mem)badges.push({i:"★",t:"Member — supports the channel"});
  let fx=RAR[rarity].fx;
  if(c.mod&&rarity!=="mythic")fx="ember";
  else if(c.mem&&(rarity==="rare"))fx="foil";
  return{...c,rank,rarity,badges,fx};
});

const EARNED=[[45,9319],[46,9826],[47,13075],[48,19348],[49,20686],[51,23736],[52,24412],
 [53,26222],[54,26620],[57,27820],[58,30009],[60,31402],[62,35183],[63,35979],[64,36377],
 [65,36576],[66,39489],[67,39688],[69,40246],[70,40286],[71,40286],[72,41082],[73,42077],
 [74,42674],[75,42873],[76,43271],[77,43390],[78,43390],[79,44037],[80,44037]];
const ARR=[[1,32160],[2,31524],[3,31524],[4,29208],[5,28332],[6,28332],[7,28824],[9,30024],
 [10,30444],[11,29964],[12,30276],[13,30276],[14,29712],[15,29811],[16,28800],[17,28896],
 [18,28668],[20,27576],[21,27576],[23,26328],[24,24048],[25,24816],[26,24744],[27,22872],
 [28,22872],[29,22872],[30,22296],[31,22296],[33,21672],[34,21672],[35,21672],[38,21636],
 [39,21636],[41,20154],[42,20154]];

const BADGES=[
 ["day-one","Day One","Was in chat during the first three days of the run.","legendary","prismatic","☀"],
 ["og-hundred","OG Hundred","Among the first 100 people ever to post in chat.","epic","foil","✿"],
 ["the-regular","The Regular","Showed up for 25 or more streams.","epic","holo","♟"],
 ["iron-streak","Iron Streak","Seven streams in a row without missing one.","legendary","ember","▲"],
 ["century","Century","Posted 100 messages.","common","none","⑩"],
 ["millennium","Millennium","Posted 1,000 messages.","rare","holo","♜"],
 ["ten-k-club","Ten-K Club","Posted 10,000 messages. Genuinely remarkable.","mythic","aurora","✵"],
 ["first-light","First Light","Sent the first message of a stream, five times or more.","epic","foil","◔"],
 ["night-owl","Night Owl","Still in chat four hours into a stream.","rare","holo","☽"],
 ["marathoner","Marathoner","Present from the first hour to the last of one stream.","epic","holo","❀"],

 [0.84,"design","Give the forge cards a per-task result panel with accept and commit actions.","@humblelifeskills"],

];

 ["done","Ship the agentic kanban (forge) with bidirectional task delegation","Day 39"],
 ["done","Cross-agent memory digest for every CLI agent's first prompt","Day 38"],

/* ── procedural portrait: deterministic hue from the handle ── */
function hashOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function portrait(h){
  const n=hashOf(h),a=n%360,b=(a+58+n%44)%360;
  const init=h.replace(/^@/,"").slice(0,2).toUpperCase();
  return`<div class="port" style="background:linear-gradient(145deg,hsl(${a} 62% 46%),hsl(${b} 58% 26%))"><b>${init}</b></div>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function cardHTML(c,{big=false}={}){
  const r=RAR[c.rarity];
  return`<button class="card" data-effect="${c.fx}" data-handle="${esc(c.h)}"
    style="--rc:${r.c}" aria-label="${esc(c.h)}, rank ${c.rank}, ${c.rarity}">
    <div class="card-in">
      <div class="cardtop"><span class="rank">#${c.rank}</span><span class="rar">${c.rarity}</span></div>
      ${portrait(c.h)}
      <div class="cardname">${esc(c.h)}</div>
      <div class="pips">${c.badges.map(b=>`<span class="pip" title="${esc(b.t)}">${b.i}</span>`).join("")}</div>
      <div class="cardstats">
        <span class="stat">${c.m}<i> msg</i></span>
        ${c.mod?'<span class="stat">MOD</span>':""}${c.mem?'<span class="stat">★</span>':""}
      </div>
      <div class="sheen"></div>
    </div></button>`;
}

/* ── line chart ── */
function lineChart(series,{w=860,h=280,color="var(--honey)",label="USD"}={}){
  const pad={l:62,r:18,t:16,b:34};
  const xs=series.map(d=>d[0]),ys=series.map(d=>d[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y1=Math.max(...ys);
  const yTop=Math.ceil(y1/5000)*5000;
  const X=v=>pad.l+(v-x0)/(x1-x0)*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-(v/yTop)*(h-pad.t-pad.b);
  const pts=series.map(d=>[X(d[0]),Y(d[1])]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${pts.at(-1)[0].toFixed(1)} ${h-pad.b} L ${pts[0][0].toFixed(1)} ${h-pad.b} Z`;
  let ticks="";
  for(let v=0;v<=yTop;v+=yTop/4){
    ticks+=`<line x1="${pad.l}" y1="${Y(v)}" x2="${w-pad.r}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${pad.l-9}" y="${Y(v)+4}" fill="var(--fg-faint)" font-size="11" text-anchor="end"
       font-family="JetBrains Mono, monospace">$${(v/1000).toFixed(0)}k</text>`;
  }
  let xl="";
  for(const d of series.filter((_,i)=>i%Math.ceil(series.length/6)===0||i===series.length-1)){
    xl+=`<text x="${X(d[0])}" y="${h-pad.b+19}" fill="var(--fg-faint)" font-size="11" text-anchor="middle"
      font-family="JetBrains Mono, monospace">d${d[0]}</text>`;
  }
  const last=pts.at(-1),lastV=series.at(-1)[1];
  return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
    aria-label="${label}: $${series[0][1].toLocaleString()} on day ${series[0][0]} rising to $${lastV.toLocaleString()} on day ${series.at(-1)[0]}">
    <defs><linearGradient id="g-${label}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".34"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks}${xl}
    <path d="${area}" fill="url(#g-${label})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${color}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="10" fill="${color}" opacity=".22"/>
    <text x="${last[0]-6}" y="${last[1]-16}" fill="${color}" font-size="13" font-weight="700"
      text-anchor="end" font-family="JetBrains Mono, monospace">$${lastV.toLocaleString()}</text>
  </svg>`;
}

function barChart(series,{w=860,h=250,label="messages"}={}){
  const pad={l:52,r:14,t:14,b:34};
  const max=Math.max(...series.map(d=>d[1])),bw=(w-pad.l-pad.r)/series.length;
  const Y=v=>h-pad.b-(v/max)*(h-pad.t-pad.b);
  let bars="",xl="",ticks="";
  for(let v=0;v<=max;v+=Math.ceil(max/4/10)*10){
    ticks+=`<line x1="${pad.l}" y1="${Y(v)}" x2="${w-pad.r}" y2="${Y(v)}" stroke="var(--line)"/>
      <text x="${pad.l-9}" y="${Y(v)+4}" fill="var(--fg-faint)" font-size="11" text-anchor="end"
       font-family="JetBrains Mono, monospace">${v}</text>`;
  }
  series.forEach((d,i)=>{
    const x=pad.l+i*bw+bw*.17,bh=h-pad.b-Y(d[1]);
    bars+=`<rect x="${x.toFixed(1)}" y="${Y(d[1]).toFixed(1)}" width="${(bw*.66).toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}"
      rx="2.5" fill="var(--r-rare)" opacity="${.45+.55*d[1]/max}"><title>${esc(d[0])}: ${d[1]} ${label}</title></rect>`;
    if(i%Math.ceil(series.length/8)===0)
      xl+=`<text x="${(x+bw*.33).toFixed(1)}" y="${h-pad.b+19}" fill="var(--fg-faint)" font-size="10.5"
        text-anchor="middle" font-family="JetBrains Mono, monospace">${esc(d[0])}</text>`;
  });
  return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
    aria-label="Chat volume by hour of stream, peaking at ${max} ${label}">${ticks}${bars}${xl}</svg>`;
}

function wireCards(){
  document.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("pointermove",e=>{
      const r=el.getBoundingClientRect();
      const mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height;
      el.style.setProperty("--mx",mx.toFixed(3));el.style.setProperty("--my",my.toFixed(3));
      if(!matchMedia("(prefers-reduced-motion: reduce)").matches)
        el.style.transform=`perspective(760px) rotateY(${(mx-.5)*17}deg) rotateX(${(.5-my)*17}deg) translateZ(6px)`;
    });
    el.addEventListener("pointerleave",()=>{el.style.transform="";
      el.style.setProperty("--mx",.5);el.style.setProperty("--my",.5)});
    el.addEventListener("click",()=>{
      const f=ROSTER.find(c=>c.h===el.dataset.handle); if(f){selected=f;go("member")}});
  });
  document.querySelectorAll(".rowbtn").forEach(b=>b.addEventListener("click",()=>{
    const f=ROSTER.find(c=>c.h===b.dataset.handle); if(f){selected=f;go("member")}}));
}
function go(v){
  if(!VIEWS[v])return;
  current=v; try{location.hash=v}catch(e){} render();
  window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
document.querySelector("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]"); if(b)go(b.dataset.view)});
