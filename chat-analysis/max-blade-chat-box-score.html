<style>
/* Layout: a sports box score for a live-stream chat. Masthead, tab strip of games (streams),
   dense ranked tables with inline meters, rows that open into scouting reports. */
:root {
  --paper: #eef1f5; --card: #ffffff; --ink: #141a24; --muted: #586276; --rule: #d6dce6;
  --accent: #d2402f; --meter: #3b5aa0; --meter-track: #e3e8f0; --chip: #e9edf4;
  --good: #1f7a4d; --warn: #a3620a;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f131a; --card: #161c26; --ink: #e8ebf1; --muted: #9aa3b5; --rule: #2a3242;
  --accent: #ff6b59; --meter: #86a2e6; --meter-track: #242c3a; --chip: #212938;
  --good: #5ccf94; --warn: #e2a64a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f131a; --card: #161c26; --ink: #e8ebf1; --muted: #9aa3b5; --rule: #2a3242;
  --accent: #ff6b59; --meter: #86a2e6; --meter-track: #242c3a; --chip: #212938;
  --good: #5ccf94; --warn: #e2a64a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap > * { min-width: 0 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 22px }
@media (max-width: 520px) { .wrap { padding-inline: 16px } }

/* masthead */
.mast { display: grid; gap: 10px; border-bottom: 3px solid var(--ink); padding-bottom: 16px }
.eyebrow { font: 600 12px/1 var(--f-data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block }
h1 { font: 800 clamp(44px, 8vw, 84px)/.9 var(--f-display); margin: 0; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance }
.dek { margin: 0; color: var(--muted); max-width: 70ch }
.strip { display: flex; flex-wrap: wrap; gap: 6px 26px; font-family: var(--f-data); font-size: 13px; font-variant-numeric: tabular-nums }
.strip b { font-size: 20px; font-weight: 600; display: block; color: var(--ink) }
.strip span { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--rule); scrollbar-width: thin }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
  padding: 10px 14px 9px; cursor: pointer; text-align: left; white-space: nowrap; font: inherit; display: grid; gap: 1px }
.tab small { font: 400 11px/1.2 var(--f-data); letter-spacing: .06em; text-transform: uppercase }
.tab strong { font: 600 18px/1.1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; color: var(--ink) }
.tab[aria-selected="true"] { border-bottom-color: var(--accent) }
.tab[aria-selected="true"] small { color: var(--accent) }
.tab:hover strong { text-decoration: underline; text-underline-offset: 3px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* panel header */
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: end }
.phead h2 { font: 800 clamp(28px, 4.4vw, 40px)/1 var(--f-display); text-transform: uppercase; margin: 0; text-wrap: balance }
.phead .meta { font: 13px/1.5 var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums }
.phead .meta a { color: var(--ink) }
.controls { display: flex; gap: 8px; flex-wrap: wrap }
.controls label { font: 600 11px/1 var(--f-data); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: grid; gap: 5px }
.controls select, .controls input { font: 14px var(--f-body); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; min-width: 0 }
.controls input { width: 180px }

/* table */
.tablebox { overflow-x: auto; background: var(--card); border: 1px solid var(--rule); border-radius: 10px }
table { width: 100%; border-collapse: collapse; min-width: 820px; font-variant-numeric: tabular-nums }
th { font: 600 11px/1.2 var(--f-data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 12px 10px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap }
th.num, td.num { text-align: right }
td { padding: 10px; border-bottom: 1px solid var(--rule); vertical-align: middle }
tr.row { cursor: pointer }
tr.row:hover td { background: color-mix(in srgb, var(--chip) 60%, transparent) }

.rk { font: 800 26px/1 var(--f-display); width: 44px }

.who { display: grid; gap: 2px; min-width: 190px }
.handle { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.arch { color: var(--muted); font-size: 13px; font-style: italic }
.badge { font: 600 10px/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted) }
.badge.you { border-color: var(--accent); color: var(--accent) }
.badge.flag { border-color: var(--warn); color: var(--warn) }
.mono { font-family: var(--f-data); font-size: 13px }
.sub { color: var(--muted); font-size: 11px; font-family: var(--f-data); display: block; white-space: nowrap }
.meter { display: grid; grid-template-columns: 1fr 26px; gap: 6px; align-items: center; min-width: 92px }

.meter i b { position: absolute; inset: 0 auto 0 0; background: var(--meter); border-radius: 3px }
.meter span { font: 12px var(--f-data); text-align: right; color: var(--muted) }
.score { font: 800 28px/1 var(--f-display); text-align: right }
.dots { display: flex; gap: 4px }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); opacity: .45 }
.dots i.on { background: var(--muted); opacity: .9 }
.dots i.top { background: var(--accent); border-color: var(--accent); opacity: 1 }

/* expanded scouting report */
tr.detail td { background: var(--chip); padding: 4px 16px 20px }
.report { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px 32px }

.report p { margin: 0; max-width: 68ch }

.traits { display: flex; flex-wrap: wrap; gap: 6px }
.traits span { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--rule) }
blockquote { margin: 0; padding: 8px 12px; background: var(--card); border-radius: 6px; font: 13px/1.45 var(--f-data); overflow-wrap: anywhere }
.quotes { display: grid; gap: 6px }
.note { border-left: 3px solid var(--accent); padding-left: 10px }
.factors { display: grid; gap: 6px }
.factors div { display: grid; grid-template-columns: 96px minmax(40px, 1fr) 28px 44px 36px; gap: 8px; align-items: center; font: 12px var(--f-data) }
.factors i { display: block; height: 6px; border-radius: 3px; background: var(--meter-track); position: relative; overflow: hidden }
.factors i b { position: absolute; inset: 0 auto 0 0; background: var(--meter); border-radius: 3px }
.factors span.v { color: var(--muted); text-align: right }
.factors em { font-style: normal; color: var(--muted); text-align: right }
.flagline { color: var(--warn); font-size: 13px }
.perstream { display: grid; gap: 4px; font: 12px var(--f-data) }
.perstream div { display: grid; grid-template-columns: 1fr 44px; gap: 8px }

/* methodology */
.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px }
.method section { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px; align-content: start }
.method h3 { font: 800 22px/1 var(--f-display); text-transform: uppercase; margin: 0 }
.method p, .method li { color: var(--muted); margin: 0; max-width: 65ch }
.method ul { margin: 0; padding-left: 18px; display: grid; gap: 4px }
.wt { display: grid; grid-template-columns: 1fr auto; font: 13px var(--f-data); border-bottom: 1px dotted var(--rule); padding-block: 3px }
.foot { color: var(--muted); font-size: 12px; font-family: var(--f-data) }

.split .p { background: var(--good) } .split .z { background: var(--muted); opacity: .45 } .split .n { background: var(--warn) }
.sent { font-weight: 600 }
.sent.pos { color: var(--good) } .sent.neg { color: var(--warn) }
.maxq { display: grid; gap: 6px }
.maxq div { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 13px }
.maxq a { font: 12px var(--f-data); color: var(--muted); white-space: nowrap }
.maxq .k { font: 600 10px/1.6 var(--f-data); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.verdict { background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--good); border-radius: 10px; padding: 16px 18px; display: grid; gap: 8px }
.verdict h3 { font: 800 26px/1.05 var(--f-display); text-transform: uppercase; margin: 0; text-wrap: balance }
.verdict p { margin: 0; max-width: 72ch }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px }
.check { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start }
.check .big { font: 800 34px/1 var(--f-display) }

.strip-chart { width: 100%; height: auto; display: block }
.strip-chart text { font: 11px var(--f-data); fill: var(--muted) }
.strip-chart .you { fill: var(--accent) }
.strip-chart .dot { fill: var(--meter); opacity: .55 }
.strip-chart .axis { stroke: var(--rule) }
.strip-chart .zero { stroke: var(--muted); stroke-dasharray: 3 3 }
.up { color: var(--good) } .down { color: var(--warn) }
.section-gap { display: grid; gap: 18px }
@media (max-width: 640px) { .hide-sm { display: none } table { min-width: 640px } }
@media (prefers-reduced-motion: no-preference) { tr.detail .report { animation: open .18s ease-out } @keyframes open { from { opacity: .4; transform: translateY(-3px) } } }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("en-US");

const dShort = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", {month:"short", day:"numeric", timeZone:"UTC"});
const P = Object.fromEntries(DATA.people.map(p => [p.name, p]));

document.getElementById("foot").textContent =

const TABS = [{id:"overall", small:"All 5 streams", strong:"Top 50"},
  ...DATA.streams.map(s => ({id:s.id, small:dShort(s.date), strong:short(s.id)})),

const tabsEl = document.getElementById("tabs"), panel = document.getElementById("panel");

tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.id, true) });

const meter = (v, label) => `<div class="meter" title="${esc(label)}: ${Math.round(v)} / 100"><i><b style="width:${Math.max(2, v)}%"></b></i><span>${Math.round(v)}</span></div>`;
const badges = p => (p.name === DATA.you ? `<span class="badge you">you</span>` : "") + (p.mod ? `<span class="badge">mod</span>` : "") + (p.flags ? `<span class="badge flag" title="${esc(p.flags)}">note</span>` : "");
const dots = p => `<div class="dots" aria-label="Streams present">${ORDER.map(id => {

const LABELS = {frequency:"Chat volume", consistency:"Consistency", positivity:"Positivity", technical:"Technical", helpfulness:"Helpfulness", substance:"Substance", humor:"Humor", presence:"Presence"};
function factors(f, weights) {
  return `<div class="factors">${Object.entries(weights).map(([k, w]) =>
    `<div><span>${LABELS[k]}</span><i title="${LABELS[k]}: ${Math.round(f[k])} / 100"><b style="width:${Math.max(2, f[k])}%"></b></i><span class="v">${Math.round(f[k])}</span><em>×${w}%</em><span style="text-align:right">${(f[k]*w/100).toFixed(1)}</span></div>`).join("")}</div>`;
}
function report(p, extra) {

    </div></div>`;
}

function wireRows(tbody, cols, detailFor) {
  tbody.addEventListener("click", e => {
    const tr = e.target.closest("tr.row"); if (!tr) return;
    const open = tr.getAttribute("aria-expanded") === "true";
    tbody.querySelectorAll("tr.detail").forEach(d => d.remove());
    tbody.querySelectorAll("tr.row").forEach(r => r.setAttribute("aria-expanded", "false"));
    if (open) return;
    tr.setAttribute("aria-expanded", "true");
    tr.insertAdjacentHTML("afterend", `<tr class="detail"><td colspan="${cols}">${detailFor(tr.dataset.name)}</td></tr>`);
  });
  tbody.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.row")) { e.preventDefault(); e.target.click(); } });
}

let overallSort = "score", overallQ = "";
function renderOverall() {
  panel.innerHTML = `
  <div class="phead">
    <div><h2>Top 50 chatters, all streams</h2>
      <div class="meta">The 50 highest-volume chatters (${top50[top50.length-1].total}+ messages each), re-ranked by composite score. Select a row for their scouting report.</div></div>

      </select></label>

  <div class="tablebox" style="margin-top:14px"><table>
    <thead><tr><th>#</th><th>Chatter</th><th class="num">Msgs</th><th>Streams</th><th>Positivity</th><th>Technical</th><th>Helpful</th><th class="hide-sm">Humor</th><th>Max's tone</th><th class="num">Score</th></tr></thead>
    <tbody id="tb"></tbody></table></div>`;
  const sel = document.getElementById("sortSel"), q = document.getElementById("q"), tb = document.getElementById("tb");
  sel.value = overallSort; q.value = overallQ;
  const draw = () => {
    const key = overallSort, needle = overallQ.trim().toLowerCase();
    const val = p => key === "score" ? p.score : key === "total" ? p.total : key === "max" ? (p.max ? p.max.count + p.max.avg / 10 : -1) : p.f[key];
    const list = [...top50].sort((a, b) => val(b) - val(a) || b.score - a.score)
      .filter(p => !needle || p.name.toLowerCase().includes(needle) || p.archetype.toLowerCase().includes(needle));
    tb.innerHTML = list.map((p, i) => `<tr class="row" tabindex="0" aria-expanded="false" data-name="${esc(p.name)}">
      <td class="rk">${key === "score" && !needle ? p.rank : i + 1}</td>
      <td><div class="who"><div class="handle">${esc(p.name)} ${badges(p)}</div><div class="arch">${esc(p.archetype)}</div></div></td>

  };
  sel.addEventListener("change", () => { overallSort = sel.value; draw(); });
  q.addEventListener("input", () => { overallQ = q.value; draw(); });
  wireRows(tb, 10, name => report(P[name]));
  draw();
}

    const r = s.rows.find(x => x.name === name);
    const extra = `<div class="note"><h4>This stream</h4><p>${esc(r.note || "No stream-specific note.")}</p>
      <div class="sub" style="margin-top:6px">${r.n} msgs · ${r.qPct}% questions · avg ${r.avgWords} words · active across ${r.span}% of the stream</div></div>
      <div><h4>Stream factor breakdown</h4>${factors(r.f, DATA.weightsStream)}</div>`;
    return report(P[name], extra);
  });
}

function renderMethod() {
  const w = o => Object.entries(o).map(([k, v]) => `<div class="wt"><span>${LABELS[k]}</span><span>${v}%</span></div>`).join("");
  panel.innerHTML = `<div class="phead"><div><h2>How the scores work</h2>
    <div class="meta">Every score is 0–100. Composite = weighted sum of the factors below.</div></div></div>
  <div class="method" style="margin-top:14px">
    <section><h3>Data</h3><p>Full chat replays of the 5 most recent finished streams on @MaxBladeTv (Sep 23–30, 2026), scraped with Apify. Today's live stream was skipped because its replay isn't complete. Max's own messages are excluded.</p>
      <p>Top 50 = the 50 chatters with the most messages across all 5 streams. Per-stream tabs show the 15 chatters with the most messages in that stream.</p></section>
    <section><h3>Top 50 weights</h3>${w(DATA.weightsAll)}<p>Consistency = share of the 5 streams they chatted in.</p></section>
    <section><h3>Per-stream weights</h3>${w(DATA.weightsStream)}<p>Presence = how much of the stream's runtime their messages span.</p></section>
    <section><h3>Factors</h3><ul>
      <li><b>Chat volume</b>: √(messages ÷ the leader's), so a few hundred messages don't swamp everything else.</li>
      <li><b>Positivity</b>: 75% an analyst read of tone (banter counts as friendly), 25% VADER sentiment over every message.</li>
      <li><b>Technical</b>: quality of input, not keyword count. Name-dropping a model scores low; concrete workflows, fixes and architecture ideas score high.</li>
      <li><b>Helpfulness</b>: answering viewers, onboarding newcomers, moderating, spotting bugs for Max.</li>
      <li><b>Substance / Humor</b>: signal-to-noise, and how much they entertain the room.</li></ul></section>
    <section><h3>Caveats</h3><ul>
      <li>Qualitative scores come from a model reading each chatter's full message history against a fixed 0–10 rubric. Treat them as informed opinion.</li>
      <li>Chat is short and sarcastic. Tone reads can miss inside jokes.</li>
      <li>Personality notes describe chat behaviour only, not the person.</li></ul></section>
  </div>`;
}

const sentWord = a => a >= 1.2 ? "very warm" : a >= 0.6 ? "warm" : a >= 0.2 ? "friendly" : a > -0.2 ? "neutral" : "cool";
const sgn = x => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2);
function split(m) {
  const t = m.pos + m.neu + m.neg;
  return `<div class="split" title="${m.pos} positive · ${m.neu} neutral · ${m.neg} negative">${m.pos ? `<b class="p" style="flex:${m.pos/t}"></b>` : ""}${m.neu ? `<b class="z" style="flex:${m.neu/t}"></b>` : ""}${m.neg ? `<b class="n" style="flex:${m.neg/t}"></b>` : ""}</div>`;
}
function maxCell(p) {
  if (!p.max) return `<div class="maxcell"><span class="none">no mentions found</span></div>`;
  return `<div class="maxcell"><span>${p.max.count}× · <span class="sent ${p.max.avg > 0.2 ? "pos" : p.max.avg < -0.2 ? "neg" : ""}">${sgn(p.max.avg)}</span></span>${split(p.max)}</div>`;
}
const ytAt = (vid, t) => { const [h, m, s] = t.split(":").map(Number); return `https://www.youtube.com/watch?v=${vid}&t=${h*3600+m*60+s}s`; };
function maxQuotes(items, n) {
  const pick = [...items].sort((a, b) => Math.abs(b.sentiment) - Math.abs(a.sentiment) || (b.confidence === "high") - (a.confidence === "high")).slice(0, n);
  return `<div class="maxq">${pick.map(m => `<div><a href="${ytAt(m.video, m.time)}" target="_blank" rel="noopener">${esc(dShort(streamsById[m.video].date))} ${esc(m.time)}</a>
    <span><span class="k">${esc(m.kind.replace("_", " "))} · ${m.sentiment > 0 ? "+" : ""}${m.sentiment}</span><br>“${esc(m.quote)}”</span></div>`).join("")}</div>`;
}
function maxBlock(p) {
  const m = DATA.mentions && DATA.mentions[p.name];
  if (!m) return `<div><h4>What Max said about them</h4><p class="sub" style="white-space:normal">No spoken mentions found in the captions. Unusual handles are hard to catch in auto-captions, so this doesn't mean Max never acknowledged them.</p></div>`;
  return `<div><h4>What Max said about them · ${m.count} mention${m.count > 1 ? "s" : ""}, ${sentWord(m.avg)}</h4>
    <div class="sub" style="margin-bottom:8px">avg ${sgn(m.avg)} on a −2…+2 scale · ${m.pos} positive, ${m.neu} neutral, ${m.neg} negative · across ${m.streams} stream${m.streams > 1 ? "s" : ""}</div>
    ${maxQuotes(m.items, 3)}</div>`;
}

function renderMax() {
  const list = Object.entries(DATA.mentions).map(([name, m]) => ({name, ...m, p: P[name]}))
    .sort((a, b) => b.count - a.count || b.avg - a.avg);
  const total = list.reduce((s, x) => s + x.count, 0), neg = list.reduce((s, x) => s + x.neg, 0), pos = list.reduce((s, x) => s + x.pos, 0);
  const st = DATA.audit.mentionStats;
  panel.innerHTML = `
  <div class="phead"><div><h2>Max's shoutouts</h2>
    <div class="meta">What Max said out loud about each chatter, from the 5 stream transcripts. ${st.confirmed} confirmed mentions of ${st.people} chatters (from ${st.candidates} caption matches). ${pos} positive, ${total - pos - neg} neutral, ${neg} negative. Select a row for his actual words.</div></div></div>
  <div class="tablebox" style="margin-top:14px"><table>
    <thead><tr><th>#</th><th>Chatter</th><th class="num">Mentions</th><th class="num">Streams</th><th>Tone mix</th><th class="num">Avg tone</th><th class="hide-sm">Most common</th><th class="num">Overall rank</th></tr></thead>
    <tbody id="tb">${list.map((x, i) => `<tr class="row" tabindex="0" aria-expanded="false" data-name="${esc(x.name)}">
      <td class="rk">${i + 1}</td>
      <td><div class="who"><div class="handle">${esc(x.name)} ${badges(x.p)}</div><div class="arch">${esc(x.p.archetype)}</div></div></td>
      <td class="num mono">${x.count}</td><td class="num mono">${x.streams}</td>
      <td style="min-width:120px">${split(x)}<span class="sub">${x.pos} + · ${x.neu} 0 · ${x.neg} −</span></td>
      <td class="num mono"><span class="sent ${x.avg > 0.2 ? "pos" : x.avg < -0.2 ? "neg" : ""}">${sgn(x.avg)}</span><span class="sub">${sentWord(x.avg)}</span></td>
      <td class="hide-sm mono">${esc(Object.keys(x.kinds).filter(k => k !== "other").slice(0, 2).join(", ").replace(/_/g, " "))}</td>
      <td class="num mono">${x.p.rank ? "#" + x.p.rank : "—"}</td></tr>`).join("")}</tbody></table></div>
  <p class="foot" style="margin-top:12px">Tone scale: −2 hostile, −1 dismissive, 0 neutral read-out, +1 friendly / thanks / affectionate teasing, +2 strong praise ("legend", "my goat"). Each match was checked by a model reviewer against Max's speech ±45s and the chatter's recent messages, and only high/medium-confidence mentions are counted. Max's own chat messages were all links, so tone comes only from his voice. Handles that are hard to pronounce or caption (e.g. @Gnokain, @lepahc, @two6hundo) are under-detected. Mentions are reported separately and are not part of the composite score.</p>`;
  wireRows(document.getElementById("tb"), 8, name => {
    const m = DATA.mentions[name];
    return `<div class="report"><div class="col"><div><h4>Max's words · all ${m.count} mentions</h4>${maxQuotes(m.items, m.count)}</div></div>
      <div class="col"><div><h4>Personality · ${esc(P[name].archetype)}</h4><p>${esc(P[name].personality)}</p></div></div></div>`;
  });
}

function renderAudit() {
  const A = DATA.audit, you = DATA.you, rows = A.rows;
  const meRow = rows.find(r => r.name === you);
  // strip chart of (original − blind) composite deltas
  const W = 720, H = 120, pad = 30, xs = rows.map(r => r.scoreDelta);
  const lo = Math.floor(Math.min(...xs, -1)), hi = Math.ceil(Math.max(...xs, 1));
  const X = v => pad + (v - lo) / (hi - lo) * (W - 2 * pad);
  const ticks = []; for (let t = lo; t <= hi; t += (hi - lo > 10 ? 2 : 1)) ticks.push(t);
  let k = 0;
  const dots = rows.filter(r => r.name !== you).map(r => `<circle class="dot" cx="${X(r.scoreDelta).toFixed(1)}" cy="${(52 + ((k++ * 7) % 28) - 14).toFixed(1)}" r="5"><title>${esc(r.name)}: ${r.scoreDelta > 0 ? "+" : ""}${r.scoreDelta}</title></circle>`).join("");
  const svg = `<svg class="strip-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Original minus blind score for each chatter">
    <line class="axis" x1="${pad}" x2="${W - pad}" y1="84" y2="84"/>
    ${ticks.map(t => `<line class="axis" x1="${X(t)}" x2="${X(t)}" y1="84" y2="89"/><text x="${X(t)}" y="103" text-anchor="middle">${t > 0 ? "+" : ""}${t}</text>`).join("")}
    <line class="zero" x1="${X(0)}" x2="${X(0)}" y1="22" y2="84"/>
    <line class="zero" x1="${X(A.othersDeltaMean)}" x2="${X(A.othersDeltaMean)}" y1="22" y2="84" style="stroke:var(--meter)"/>
    <text x="${X(A.othersDeltaMean) + 4}" y="20">others' avg ${A.othersDeltaMean > 0 ? "+" : ""}${A.othersDeltaMean}</text>
    ${dots}
    <circle class="you" cx="${X(meRow.scoreDelta)}" cy="52" r="7" stroke="var(--card)" stroke-width="2"><title>${esc(you)}: ${meRow.scoreDelta > 0 ? "+" : ""}${meRow.scoreDelta}</title></circle>
    <text x="${X(meRow.scoreDelta)}" y="${Math.max(12, 52 - 14)}" text-anchor="middle" style="fill:var(--accent);font-weight:600">you</text>
    <text x="${pad}" y="118">← blind scored them higher</text><text x="${W - pad}" y="118" text-anchor="end">original scored them higher →</text>
  </svg>`;
  const dimRows = Object.entries(A.dims).map(([k, v]) => `<tr><td>${LABELS[k]}</td><td class="num mono">${meRow.origRaw[k]}</td><td class="num mono">${meRow.blindRaw[k]}</td>
    <td class="num mono">${v.you > 0 ? "+" : ""}${v.you}</td><td class="num mono">${v.othersMean > 0 ? "+" : ""}${v.othersMean} ± ${v.othersSd}</td></tr>`).join("");
  panel.innerHTML = `<div class="section-gap">
  <div class="phead"><div><h2>Bias audit</h2>
    <div class="meta">Is ${esc(you)} ranked #${A.origRank} on merit? Four independent checks.</div></div></div>
  <div class="verdict"><h3>No evidence of favouritism. You hold #${A.origRank} in every check.</h3>
    <p>When every chatter was anonymised and re-scored by fresh reviewers who could not tell who anyone was, you still came out #${A.blindRank}. The first scoring pass was a little generous to almost everyone (avg +${A.othersDeltaMean} points). Your bump of ${meRow.scoreDelta > 0 ? "+" : ""}${meRow.scoreDelta} is ordinary: ${Math.round(A.shareOthersWithBiggerBoost * 100)}% of other chatters got a bigger one (z = ${A.z}). Your rank also holds without any model judgments, and under thousands of random weightings.</p></div>
  <div class="checks">
    <div class="check"><span class="lbl">1 · Blind re-score</span><span class="big">#${A.blindRank}</span><p>All 63 chatters anonymised as "Chatter-NNN". Handles, spoken names and stream titles were scrubbed from every message, and chatters were reshuffled into new reviewer groups. Blind score ${A.blindScore} vs original ${A.origScore}.</p></div>
    <div class="check"><span class="lbl">2 · Your bump vs everyone's</span><span class="big">z ${A.z}</span><p>Original minus blind composite: you ${meRow.scoreDelta > 0 ? "+" : ""}${meRow.scoreDelta}, others ${A.othersDeltaMean > 0 ? "+" : ""}${A.othersDeltaMean} ± ${A.othersDeltaSd}. Rank agreement between the two passes across all 50: Spearman ρ = ${A.spearman}.</p></div>
    <div class="check"><span class="lbl">3 · No-judgment ranking</span><span class="big">#${A.objectiveRank}</span><p>Using only message volume (50%), streams attended (25%) and automatic VADER sentiment (25%), with no model scoring at all. Top 5: ${A.objectiveTop.map(esc).join(", ")}.</p></div>
    <div class="check"><span class="lbl">4 · Random weights</span><span class="big">#${A.mc.median}</span><p>Median rank over 10,000 random weightings of the 7 factors (90% range #${A.mc.p05}–#${A.mc.p95}). Top-3 in ${Math.round(A.mc.pTop3 * 100)}% of draws. Removing any single factor never drops you below #2.</p></div>
  </div>
  <div><h4 style="font:600 11px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px">Original minus blind score, every top-50 chatter</h4>
    <div class="tablebox" style="padding:10px 6px">${svg}</div></div>
  <div class="tablebox"><table style="min-width:520px">
    <thead><tr><th>Your factor (0–10)</th><th class="num">Original</th><th class="num">Blind</th><th class="num">Your Δ</th><th class="num">Others' Δ (mean ± sd)</th></tr></thead>
    <tbody>${dimRows}</tbody></table></div>
  <div class="tablebox"><table>
    <thead><tr><th class="num">Blind #</th><th>Chatter</th><th class="num">Original #</th><th class="num">Original</th><th class="num">Blind</th><th class="num">Δ</th><th>Blind reviewer's evidence</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="rk">${r.blindRank}</td><td><div class="handle">${esc(r.name)} ${r.name === you ? '<span class="badge you">you</span>' : ""}</div></td>
      <td class="num mono">${r.origRank}</td><td class="num mono">${r.orig.toFixed(1)}</td><td class="num mono">${r.blind.toFixed(1)}</td>
      <td class="num mono ${r.scoreDelta > 2.5 ? "down" : r.scoreDelta < -1 ? "up" : ""}">${r.scoreDelta > 0 ? "+" : ""}${r.scoreDelta.toFixed(1)}</td>
      <td style="font-size:13px;color:var(--muted);min-width:260px">${esc(r.evidence)}</td></tr>`).join("")}</tbody></table></div>
  <p class="foot">What the audit can't rule out: the blind reviewers are the same kind of model as the first pass, so a bias shared by both passes would cancel out of the comparison, though the no-judgment ranking (check 3) guards against that. Your !discord / !cnvs plugs are visible to any reviewer and were not counted as helpfulness in the blind pass. The first-pass reviewer for your group did notice that your handle matched the account owner, which is why this audit exists.</p>
  </div>`;
}

function show(id, push) {
  if (!TABS.some(t => t.id === id)) id = "overall";
  tabsEl.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === id)));
  id === "overall" ? renderOverall() : id === "method" ? renderMethod() : id === "max" ? renderMax() : id === "audit" ? renderAudit() : renderStream(id);
  if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
}
show((location.hash || "").slice(1) || "overall");
</script>
